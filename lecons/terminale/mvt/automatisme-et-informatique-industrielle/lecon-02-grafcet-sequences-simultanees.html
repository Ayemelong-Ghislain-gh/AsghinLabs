c synchronisation à la fin."}, {"t": "Le système répète le gonflage tant que la pression n'est pas atteinte.", "c": 0, "e": "Reprise de séquence : c'est un cas de sélection (OU)."}]}, {"type": "fill", "title": "8. Exercice : complète les règles", "intro": "Choisis la bonne réponse, puis vérifie.", "items": [{"before": "Une divergence en ET est précédée d'une", "options": ["étape", "transition"], "answer": 1, "after": "et suivie d'étapes.", "e": "Transition → double trait → étapes."}, {"before": "Une convergence en ET est précédée d'", "options": ["étapes", "transitions"], "answer": 0, "after": "et suivie d'une transition.", "e": "Étapes → double trait → transition."}, {"before": "Pour franchir la transition de synchronisation, il faut que", "options": ["toutes les étapes précédentes soient actives", "une seule étape soit active", "aucune étape ne soit active"], "answer": 0, "after": ", et que la réceptivité soit vraie.", "e": "La transition est validée quand toutes les étapes précédentes sont actives."}, {"before": "Les réceptivités des branches d'une divergence en ET doivent être", "options": ["exclusives", "sans importance : toutes les branches démarrent ensemble"], "answer": 1, "after": ".", "e": "Il n'y a qu'une transition avant le double trait : toutes les branches démarrent ensemble."}]}, {"type": "text", "title": "9. Applications en maintenance automobile", "html": "\n<ul>\n<li><b>Cabine de peinture<\/b> : ventilation, chauffage et éclairage fonctionnent en parallèle pendant le séchage.<\/li>\n<li><b>Banc d'essai de freinage et d'éclairage<\/b> : plusieurs contrôles en même temps, puis un résultat global quand tous sont finis.<\/li>\n<li><b>Ligne de lavage<\/b> : lavage de la carrosserie et lavage des jantes en même temps.<\/li>\n<li><b>Préparation d'un véhicule<\/b> : le gonflage des pneus et la vérification des niveaux peuvent se faire en parallèle.<\/li>\n<\/ul>\n<h3>Méthode<\/h3>\n<ol>\n<li>Repérer les tâches <b>indépendantes<\/b> qui peuvent se faire en même temps.<\/li>\n<li>Écrire la séquence de <b>chaque branche<\/b> (une étape par action).<\/li>\n<li>Placer la <b>transition<\/b> de départ, puis le <b>double trait<\/b> de divergence.<\/li>\n<li>Terminer chaque branche sur une <b>étape<\/b> d'attente.<\/li>\n<li>Placer le <b>double trait<\/b> de convergence, puis la transition de synchronisation.<\/li>\n<\/ol>\n"}, {"type": "mcq", "title": "10. Quiz final", "intro": "Neuf questions pour vérifier que tu as bien compris.", "questions": [{"q": "Combien de branches sont exécutées après une divergence en ET ?", "o": ["Aucune", "Une seule", "Toutes les branches, en même temps"], "a": 2, "e": "Le franchissement de la transition active toutes les étapes situées sous le double trait."}, {"q": "Comment représente-t-on une divergence en ET ?", "o": ["Un trait simple sous une transition", "Un trait simple sous une étape", "Un double trait sous une transition"], "a": 2, "e": "Transition → double trait → étapes."}, {"q": "Qu'y a-t-il juste au-dessus d'un double trait de convergence ?", "o": ["Des étapes", "Des transitions", "Des actions"], "a": 0, "e": "Chaque branche se termine par une étape."}, {"q": "Quand la transition située sous une convergence en ET est-elle franchie ?", "o": ["Quand toutes les étapes précédentes sont actives et la réceptivité vraie", "Dès qu'une branche est terminée", "Quand aucune étape n'est active"], "a": 0, "e": "Règle de franchissement : transition validée + réceptivité vraie."}, {"q": "Cabine de peinture : la ventilation est finie, le chauffage non. Que fait le GRAFCET ?", "o": ["Il attend sur l'étape 4 que le chauffage se termine", "Il rouvre les portes", "Il revient à l'étape 0"], "a": 0, "e": "La branche terminée attend l'autre : c'est la synchronisation."}, {"q": "Quelle différence entre le trait simple et le trait double ?", "o": ["Simple : ET ; double : OU", "Simple : un seul chemin (OU) ; double : plusieurs chemins en même temps (ET)", "Aucune"], "a": 1, "e": "Simple = OU, double = ET."}, {"q": "Les réceptivités des branches d'une divergence en ET doivent-elles être exclusives ?", "o": ["Oui, mais seulement à la convergence", "Non : toutes les branches démarrent avec la même transition", "Oui, toujours"], "a": 1, "e": "L'exclusivité concerne seulement la sélection (OU)."}, {"q": "Qu'arrive-t-il si on remplace le double trait de convergence par un trait simple ?", "o": ["Rien", "La suite peut démarrer dès qu'une seule branche est finie", "Le GRAFCET ne peut plus démarrer"], "a": 1, "e": "On perd la synchronisation : l'autre branche peut rester active."}, {"q": "Quelle structure faut-il pour « laver la carrosserie et les jantes en même temps » ?", "o": ["Une reprise de séquence", "Une sélection de séquence", "Des séquences simultanées"], "a": 2, "e": "Les deux tâches sont indépendantes et simultanées."}]}, {"type": "summary", "title": "À retenir", "points": ["<b>Séquences simultanées<\/b> : plusieurs séquences s'exécutent en même temps, de façon indépendante.", "<b>Divergence en ET<\/b> : transition → <b>double trait<\/b> → étapes (toutes les branches démarrent).", "<b>Convergence en ET<\/b> : étapes → <b>double trait<\/b> → transition (synchronisation).", "La transition de convergence est franchie quand <b>toutes<\/b> les étapes précédentes sont actives et la réceptivité vraie.", "<b>Trait simple = OU<\/b> (un seul chemin) ; <b>trait double = ET<\/b> (tous les chemins).", "Chaque branche doit se terminer sur une <b>étape<\/b> avant la convergence."], "note": "✍️ Dans ton cahier : recopie le GRAFCET de la cabine de peinture et marque en couleur les deux branches parallèles et la transition de synchronisation."}]}</script>

    hist.push([t,v,cons,vmin+(u/100)*(vmax-vmin)]);if(hist.length>P.win)hist.shift()}
  function upd(){info.innerHTML='<b>'+P.vLabel+' :</b> '+v.toFixed(1)+' '+P.unit+' &nbsp; <b>Écart (consigne − mesure) :</b> '+(cons-v).toFixed(1)+' '+P.unit+' &nbsp; <b>'+P.uLabel+' :</b> '+u.toFixed(0)+' %'}
  bm.onclick=function(){mode=1-mode;bm.textContent=mode?'Boucle FERMÉE (régulation)':'Boucle OUVERTE';bm.classList.toggle('on',!!mode);I=u};
  bp.onclick=function(){pert=1-pert;bp.textContent=P.pertLabel+' : '+(pert?'OUI':'NON');bp.classList.toggle('on',!!pert)};
  rg.oninput=function(){cons=+rg.value;lab.querySelector('.rg-val').textContent=cons};
  rb.onclick=function(){v=P.v0;u=P.c0/P.K;I=u;t=0;hist=[];pert=0;mode=0;cons=P.c0;rg.value=cons;lab.querySelector('.rg-val').textContent=cons;bm.textContent='Boucle OUVERTE';bm.classList.remove('on');bp.textContent=P.pertLabel+' : NON';bp.classList.remove('on')};
  setInterval(function(){if(!isOn(s))return;step();render();upd()},100);
  step();render();upd();return s};

function buildResult(){
  var s=card('Ton résultat');
  var sc=el('div','score');s.appendChild(sc);var vd=el('p');s.appendChild(vd);
  s.appendChild(el('p','muted small','Le score compte les exercices corrigés (tri, compléter, ordonner, quiz) auxquels tu as répondu.'));
  s.appendChild(el('h3',null,'Ton avis sur cette leçon'));
  var ta=el('textarea');ta.placeholder='Ce qui est clair, ce qui est difficile, ce que tu veux revoir…';s.appendChild(ta);
  var r=el('div','row');var send=el('button','btn','Envoyer mon avis sur WhatsApp');r.appendChild(send);s.appendChild(r);
  send.onclick=function(){var t='Avis sur la leçon « '+D.title+' » (AsghinLabs Academy) :\n'+(ta.value||'(sans commentaire)')+'\nMon score : '+score+'/'+total;
    window.open('https://wa.me/237682402876?text='+encodeURIComponent(t),'_blank')};
  s.appendChild(el('p','muted small','🔗 asghinlabs.com · WhatsApp +237 682 402 876 · AsghinLabs Academy'));
  var r2=el('div','row');var rs=el('button','btn g','Recommencer la leçon');rs.onclick=function(){location.reload()};r2.appendChild(rs);s.appendChild(r2);
  s._refresh=function(){sc.textContent=total?score+' / '+total:'—';
    vd.textContent=!total?'Fais les exercices pour obtenir ton score.':score/total>=0.8?'Excellent ! Tu maîtrises cette leçon. 🎉':score/total>=0.5?'Bien ! Relis les parties où tu as hésité, puis recommence les exercices.':'Courage ! Reprends la leçon calmement, puis refais les exercices.'};
  return s}

document.getElementById('kicker').textContent=D.kicker;document.getElementById('ttl').textContent=D.title;
steps.push(B.intro());
D.sections.forEach(function(x){steps.push(B[x.type](x))});
var res=buildResult();steps.push(res);
var root=document.getElementById('steps');steps.forEach(function(s){root.appendChild(s)});
function go(d){cur=Math.max(0,Math.min(steps.length-1,cur+d));show()}
function show(){steps.forEach(function(s,i){s.classList.toggle('on',i===cur)});
  if(cur===steps.length-1)res._refresh();
  document.getElementById('pb').style.width=((cur+1)/steps.length*100)+'%';
  document.getElementById('pl').textContent='Partie '+(cur+1)+' sur '+steps.length;
  document.getElementById('pv').style.visibility=cur?'visible':'hidden';
  document.getElementById('nx').style.display=cur===steps.length-1?'none':'';window.scrollTo(0,0)}
show();
</script>
