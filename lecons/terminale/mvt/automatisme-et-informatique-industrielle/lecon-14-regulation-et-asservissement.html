    mkS(g,'text',{x:6,y:yc+34,class:'lt','text-anchor':'start',style:'fill:var(--muted);font-size:11px'},'R'+(i+1));
    yc+=r._h+14});
  var host=el('div','sim');var sc=el('div','scroll');sc.appendChild(svg);host.appendChild(sc);
  host.appendChild(el('p','muted small','↔ Sur téléphone, fais glisser le schéma si besoin. Le trait vert = le courant « passe ».'));
  var inp=el('div','inputs');
  S.inputs.forEach(function(i){var b;
    if(i.type==='push'){b=el('button','mo','⏺ '+i.label+' (maintenir)');
      var dn=function(e){e.preventDefault();vars[i.id]=1;b.classList.add('down');scan(0)},up=function(){if(vars[i.id]){vars[i.id]=0;b.classList.remove('down');scan(0)}};
      b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up);
      b.addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!vars[i.id])dn(e)}});b.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter')up()})}
    else{b=el('button','tg',i.label+' = '+vars[i.id]);if(vars[i.id])b.classList.add('on');
      b.onclick=function(){vars[i.id]=1-vars[i.id];b.textContent=i.label+' = '+vars[i.id];b.classList.toggle('on',!!vars[i.id]);scan(0)}}
    inp.appendChild(b)});
  host.appendChild(inp);
  var outs=el('div','outs');(S.outputs||[]).forEach(function(o){var d=el('span',null,'<span class="lamp"></span>'+o.label);lamps[o.id]=d.firstChild;outs.appendChild(d)});host.appendChild(outs);
  var rb=el('button','btn g s','↺ Réinitialiser');rb.onclick=function(){vars={};Object.keys(S.init||{}).forEach(function(k){vars[k]=S.init[k]});S.inputs.forEach(function(i){if(vars[i.id]==null)vars[i.id]=0});st={};refreshToggles();scan(0)};
  function refreshToggles(){var bi=inp.children;S.inputs.forEach(function(i,ix){if(i.type!=='push'){bi[ix].textContent=i.label+' = '+vars[i.id];bi[ix].classList.toggle('on',!!vars[i.id])}})}
  var r2=el('div','row');r2.appendChild(rb);host.appendChild(r2);s.appendChild(host);if(x.after)s.appendChild(el('div',null,x.after));
  function ev(n,inp2){var p;
    if(n.k==='ser'){p=inp2;n.c.forEach(function(c){p=ev(c,p)})}
    else if(n.k==='par'){p=false;n.c.forEach(function(c){if(ev(c,inp2))p=true})}
    else if(n.k==='no')p=inp2&&!!vars[n.v];
    else if(n.k==='nc')p=inp2&&!vars[n.v];
    else p=inp2;
    n._in=inp2;n._p=p;return p}
  function apply(o,p,dt){var q=st[o.v]||(st[o.v]={el:0,c:0,pe:false});
    if(o.k==='coil')vars[o.v]=p?1:0;
    else if(o.k==='set'){if(p)vars[o.v]=1}
    else if(o.k==='rst'){if(p)vars[o.v]=0}
    else if(o.k==='ton'){if(p)q.el=Math.min(o.pt,q.el+dt);else q.el=0;vars[o.v]=(p&&q.el>=o.pt-0.001)?1:0}
    else if(o.k==='tof'){if(p){vars[o.v]=1;q.el=0}else if(vars[o.v]){q.el+=dt;if(q.el>=o.pt-0.001){vars[o.v]=0;q.el=0}}}
    else if(o.k==='ctu'){if(p&&!q.pe)q.c++;q.pe=p;if(o.rst&&vars[o.rst])q.c=0;vars[o.v]=q.c>=o.pv?1:0}
    o._out=p}
  function scan(dt){S.rungs.forEach(function(r){var p=ev(r.tree,true);apply(r.out,p,dt);r.out._in=p});paint()}
  function paint(){
    wires.forEach(function(w){var on=w.k==='in'?w.n._in:w.n._p;if(w.n.k==='coil'||w.n.k==='set'||w.n.k==='rst'||w.n.k==='ton'||w.n.k==='tof'||w.n.k==='ctu')on=w.k==='in'?w.n._in:w.n._in;w.e.setAttribute('class','lw'+(on?' on':''))});
    function col(n){if(n.c&&n.k!=='coil'&&n.k!=='set'&&n.k!=='rst'&&n.k!=='ton'&&n.k!=='tof'&&n.k!=='ctu'){n.c.forEach(col);return}
      if(n.k==='no'||n.k==='nc'){var on=n._in&&n._p;[n._s1,n._s2,n._s3,n._t].forEach(function(e){if(e)e.setAttribute('class',(e===n._t?'lt':'ls')+(on?' on':''))})}
      else{var oo=n._in;if(n._c)n._c.setAttribute('class','lbox'+(oo?' on':''));
        if(n._d){var q=st[n.v]||{el:0,c:0};n._d.textContent=n.k==='ctu'?('CV='+q.c+' / '+n.pv+(vars[n.v]?'  ✔':'')):(q.el.toFixed(1)+' / '+n.pt+' s'+(vars[n.v]?'  ✔':''))}}}
    S.rungs.forEach(function(r){col(r.tree);col(r.out)});
    (S.outputs||[]).forEach(function(o){lamps[o.id].className='lamp'+(vars[o.id]?' on':'')})}
  setInterval(function(){if(isOn(s))scan(0.1)},100);
  scan(0);return s};

/* ---------- Régulation : boucle ouverte / fermée ---------- */
B.regul=function(x){
  var s=card(x.title);if(x.intro)s.appendChild(el('div',null,x.intro));
  (x.missions||[]).forEach(function(m){s.appendChild(el('div','mission','🎯 '+m))});
  var P=x.spec,v=P.v0,u=P.c0/P.K,I=u,t=0,pert=0,mode=0,cons=P.c0,hist=[];
  var host=el('div','sim');
  var ctl=el('div','rg-ctl');
  var bm=el('button','tg','Boucle OUVERTE'),bp=el('button','tg',P.pertLabel+' : NON');
  var lab=el('label',null,'Consigne : <span class="rg-val" id="cv">'+cons+'</span> '+P.unit+' ');var rg=el('input');rg.type='range';rg.min=P.cmin;rg.max=P.cmax;rg.value=cons;lab.appendChild(rg);
  ctl.appendChild(bm);ctl.appendChild(bp);ctl.appendChild(lab);host.appendChild(ctl);
  var W=640,H=250,L=44,R=W-12,T=12,Bm=H-26;
  var svg=mkS(null,'svg',{viewBox:'0 0 '+W+' '+H});svg.style.width='100%';svg.style.minWidth='520px';svg.style.maxWidth=W+'px';
  var sc=el('div','scroll');sc.appendChild(svg);host.appendChild(sc);
  var info=el('div','acts');host.appendChild(info);
  var key=el('p','muted small','<span style="color:var(--accent)">━</span> '+P.vLabel+' &nbsp; <span style="color:var(--ok)">╌</span> consigne &nbsp; <span style="color:var(--warn)">━</span> '+P.uLabel);host.appendChild(key);
  var r2=el('div','row');var rb=el('button','btn g s','↺ Recommencer');r2.appendChild(rb);host.appendChild(r2);s.appendChild(host);if(x.after)s.appendChild(el('div',null,x.after));
  var vmin=P.cmin-40,vmax=P.cmax+30;
  function Y(val){return Bm-(val-vmin)/(vmax-vmin)*(Bm-T)}
  function X(i){return L+i/(P.win-1)*(R-L)}
  function render(){
    while(svg.firstChild)svg.removeChild(svg.firstChild);
    for(var g=Math.ceil(vmin/20)*20;g<=vmax;g+=20){mkS(svg,'line',{x1:L,y1:Y(g),x2:R,y2:Y(g),class:'pl-ax'});mkS(svg,'text',{x:L-6,y:Y(g)+4,class:'pl-tx','text-anchor':'end'},String(g))}
    mkS(svg,'text',{x:L,y:H-6,class:'pl-tx'},'temps (dernières '+Math.round(P.win*P.dt*P.sub)+' s)');
    function poly(cls,k){var pts=hist.map(function(h,i){return X(i+(P.win-hist.length))+','+Y(h[k])}).join(' ');if(hist.length>1)mkS(svg,'polyline',{points:pts,class:cls})}
    poly('pl-c',2);poly('pl-u',3);poly('pl-v',1)}
  function step(){var errv=cons-v;
    for(var k=0;k<P.sub;k++){
      if(mode===0){u=Math.max(0,Math.min(100,cons/P.K))}
      else{I+=P.Ki*errv*P.dt;u=Math.max(0,Math.min(100,P.Kp*errv+I));if(u>=100&&I>100)I=100;if(u<=0&&I<0)I=0}
      var pp=pert?P.pert:0;v+=P.dt*(P.K*u-pp-v)/P.tau;errv=cons-v;t+=P.dt}
    hist.push([t,v,cons,vmin+(u/100)*(vmax-vmin)]);if(hist.length>P.win)hist.shift()}
  function upd(){info.innerHTML='<b>'+P.vLabel+' :</b> '+v.toFixed(1)+' '+P.unit+' &nbsp; <b>Écart (consigne − mesure) :</b> '+(cons-v).toFixed(1)+' '+P.unit+' &nbsp; <b>'+P.uLabel+' :</b> '+u.toFixed(0)+' %'}
  bm.onclick=function(){mode=1-mode;bm.textContent=mode?'Boucle FERMÉE (régulation)':'Boucle OUVERTE';bm.classList.toggle('on',!!mode);I=u};
  bp.onclick=function(){pert=1-pert;bp.textContent=P.pertLabel+' : '+(pert?'OUI':'NON');bp.classList.toggle('on',!!pert)};
  rg.oninput=function(){cons=+rg.value;lab.querySelector('.rg-val').textContent=cons};
  rb.onclick=function(){v=P.v0;u=P.c0/P.K;I=u;t=0;hist=[];pert=0;mode=0;cons=P.c0;rg.value=cons;lab.querySelector('.rg-val').textContent=cons;bm.textContent='Boucle OUVERTE';bm.classList.remove('on');bp.textContent=P.pertLabel+' : NON';bp.classList.remove('on')};
  setInterval(function(){if(!isOn(s))return;step();render();upd()},100);
  step();render();upd();return s};

function buildResult(){
  var s=card('Ton résultat');
  var sc=el('div','score');s.appendChild(sc);var vd=el('p');s.appendChild(vd);
  s.appendChild(el('p','muted small','Le score compte les exercices corrigés (tri, compléter, ordonner, quiz) auxquels tu as répondu.'));
  s.appendChild(el('h3',null,'Ton avis sur cette leçon'));
  var ta=el('textarea');ta.placeholder='Ce qui est clair, ce qui est difficile, ce que tu veux revoir…';s.appendChild(ta);
  var r=el('div','row');var send=el('button','btn','Envoyer mon avis sur WhatsApp');r.appendChild(send);s.appendChild(r);
  send.onclick=function(){var t='Avis sur la leçon « '+D.title+' » (AsghinLabs Academy) :\n'+(ta.value||'(sans commentaire)')+'\nMon score : '+score+'/'+total;
    window.open('https://wa.me/237682402876?text='+encodeURIComponent(t),'_blank')};
  s.appendChild(el('p','muted small','🔗 asghinlabs.com · WhatsApp +237 682 402 876 · AsghinLabs Academy'));
  var r2=el('div','row');var rs=el('button','btn g','Recommencer la leçon');rs.onclick=function(){location.reload()};r2.appendChild(rs);s.appendChild(r2);
  s._refresh=function(){sc.textContent=total?score+' / '+total:'—';
    vd.textContent=!total?'Fais les exercices pour obtenir ton score.':score/total>=0.8?'Excellent ! Tu maîtrises cette leçon. 🎉':score/total>=0.5?'Bien ! Relis les parties où tu as hésité, puis recommence les exercices.':'Courage ! Reprends la leçon calmement, puis refais les exercices.'};
  return s}

document.getElementById('kicker').textContent=D.kicker;document.getElementById('ttl').textContent=D.title;
steps.push(B.intro());
D.sections.forEach(function(x){steps.push(B[x.type](x))});
var res=buildResult();steps.push(res);
var root=document.getElementById('steps');steps.forEach(function(s){root.appendChild(s)});
function go(d){cur=Math.max(0,Math.min(steps.length-1,cur+d));show()}
function show(){steps.forEach(function(s,i){s.classList.toggle('on',i===cur)});
  if(cur===steps.length-1)res._refresh();
  document.getElementById('pb').style.width=((cur+1)/steps.length*100)+'%';
  document.getElementById('pl').textContent='Partie '+(cur+1)+' sur '+steps.length;
  document.getElementById('pv').style.visibility=cur?'visible':'hidden';
  document.getElementById('nx').style.display=cur===steps.length-1?'none':'';window.scrollTo(0,0)}
show();
</script>
